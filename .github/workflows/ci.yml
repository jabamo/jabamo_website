name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Run Unit Tests
      run: npm run test:unit -- --run --reporter=verbose --reporter=junit --outputFile=unit-test-results.xml

    - name: Run Unit Tests with Coverage
      run: npm run test:coverage -- --run

    - name: Run E2E Tests
      run: npm run test:e2e -- --run --reporter=verbose --reporter=junit --outputFile=e2e-test-results.xml

    - name: Build site (SSR)
      run: npm run build

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: success()
      with:
        files: ./coverage/lcov.info
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: unit-test-results.xml,e2e-test-results.xml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set lower case repository name
      run: |
        echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
          ghcr.io/${{ env.REPO_LOWER }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Trigger deployment on server
      env:
        SSH_KEY: ${{ secrets.REMOTE_DEPLOY_SSH_KEY }}
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.REMOTE_HOST_USERNAME }}
        REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        PROJECT_DIR: ${{ secrets.PROJECT_DIR }}
        COMPOSE_PROJECT_NAME: ${{ secrets.COMPOSE_PROJECT_NAME }}
        NODE_ENV: ${{ secrets.NODE_ENV }}
        HOST: ${{ secrets.HOST }}
        PORT: ${{ secrets.PORT }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        printf "%s\n%s\n%s\n%s\n%s\n%s\n%s\n" \
          "${{ github.actor }}" \
          "$REGISTRY_PASSWORD" \
          "$PROJECT_DIR" \
          "$COMPOSE_PROJECT_NAME" \
          "$NODE_ENV" \
          "$HOST" \
          "$PORT" | \
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" "${{ github.sha }}"